services:
  # ----------------------------------------------------------------------------
  # Truckify Backend API (Express.js on Node.js 22+)
  # ----------------------------------------------------------------------------
  - type: web
    name: truckify-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: '*'
      - key: PAYMENT_MODE
        value: simulated

  # ----------------------------------------------------------------------------
  # Truckify Frontend (React + Vite SPA)
  # ----------------------------------------------------------------------------
  - type: static
    name: truckify-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://truckify-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
